# Serves the Next.js static export (out/). Used by the website Dockerfile; the
# same rules work in a server {} block for example.com on your own nginx.
server {
    listen 80;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # The export writes /slug.html, so try the bare path, then .html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed build assets never change.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Nested on purpose: a ^~ prefix location skips regex locations at the
        # server level, so pdf.js and ONNX .mjs workers need the rule here too.
        location ~* \.mjs$ { default_type application/javascript; }
    }

    # ES-module workers (pdf.js, ONNX Runtime) outside /_next/static.
    location ~* \.mjs$ { default_type application/javascript; }

    # Per-tool Open Graph cards are written without a file extension.
    location ~ /opengraph-image$ { default_type image/png; }

    # The service worker must always be revalidated.
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }
}
