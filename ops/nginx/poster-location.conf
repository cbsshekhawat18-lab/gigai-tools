    # Supporter poster pages (backend/app/v1/poster.py). /p/{slug} is answered
    # by the backend: it returns the static site's shell (out/p.html) with this
    # page's title and Open Graph tags injected, and the shell loads the page
    # data in the browser. Place this regex location before any rewrite rules
    # that could match these URLs. Everything else under /p is the static site.
    location ~ "^/p/(?<poster_slug>[a-z0-9-]{3,40})/?$" {
        proxy_pass http://127.0.0.1:8000/v1/poster/html/$poster_slug$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # add_header in a location replaces the server-level set: restate it.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
