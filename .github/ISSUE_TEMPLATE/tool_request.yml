name: New tool
description: Propose a tool that GigAI Tools does not have yet.
labels: ["new tool"]
body:
  - type: markdown
    attributes:
      value: |
        Check the tool list first: https://cbsshekhawat18-lab.github.io/gigai-tools/tools/
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: PDF to EPUB
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What it does, and for whom
      description: The input, the output, and who needs it.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Can it run in the browser?
      options:
        - "Yes"
        - "No, it needs a server"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: engine
    attributes:
      label: How it could work
      description: A library, a format specification or an algorithm, if you know one.
