name: Bug report
description: A tool or page gives a wrong result, fails, or breaks.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here: see SECURITY.md and report them privately.
  - type: input
    id: tool
    attributes:
      label: Tool or page
      description: Its address, for example https://gigai.tools/compress-pdf
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: A file that shows it
      description: Attach a file that fails, if you can share it. Remove anything private first.
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A tool (in the browser)
        - The website (pages, search, navigation)
        - The backend (/api)
        - The developer API (/v1) or the worker
        - Self-hosting, Docker or ops/
        - Documentation
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error output
      description: Anything from the browser console or the server log.
      render: text
